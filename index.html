<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تقييم وفلترة السير الذاتية بالذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-center text-indigo-900 mb-8">منصة تقييم وفلترة السير الذاتية بالذكاء الاصطناعي</h1>
        
        <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <div>
                <label class="block text-gray-700 font-medium mb-2">اسم الوظيفة المطلوبة *</label>
                <input type="text" id="jobTitle" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="مثال: Business Development">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">تفاصيل وملاحظات الوظيفة (اختياري)</label>
                <textarea id="jobDetails" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="أبرز المتطلبات، سنوات الخبرة..."></textarea>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">ملف السيرة الذاتية (PDF أو النص)</label>
                <input type="file" id="cvFile" class="w-full p-3 border rounded-lg bg-gray-50">
            </div>

            <button onclick="analyzeCV()" id="submitBtn" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold hover:bg-indigo-700 transition">بدء التحليل الذكي</button>
        </div>

        <div id="resultContainer" class="mt-8 bg-white p-6 rounded-xl shadow-md hidden">
            <h2 class="text-xl font-bold text-indigo-900 mb-4">نتيجة التقييم:</h2>
            <div id="resultText" class="text-gray-800 whitespace-pre-wrap leading-relaxed"></div>
        </div>
    </div>

    <script>
        async function analyzeCV() {
            const jobTitle = document.getElementById('jobTitle').value;
            const jobDetails = document.getElementById('jobDetails').value;
            const fileInput = document.getElementById('cvFile');
            const btn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');

            if (!jobTitle || fileInput.files.length === 0) {
                alert('يرجى إدخال اسم الوظيفة ورفع ملف السيرة الذاتية.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const fileContent = e.target.result;
                btn.innerText = 'جاري التحليل بواسطة الذكاء الاصطناعي...';
                btn.disabled = true;

                try {
                    const prompt = `أنت خبير توظيف ومحلل سير ذاتية. قم بتقييم السيرة الذاتية التالية للوظيفة المطلوبة: "${jobTitle}".
                    ملاحظات إضافية عن الوظيفة: "${jobDetails}".
                    محتوى السيرة الذاتية:
                    ${fileContent}
                    
                    أعطني تقييماً مفصلاً يشتمل على:
                    1. نسبة التوافق (من 100).
                    2. أبرز نقاط القوة.
                    3. نقاط الضعف أو النقص.
                    4. قرار نهائي (هل يُنصح بقبوله للمقابلة أم لا ولماذا؟).`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AQ.Ab8RN6K7X7diBNn_TAgjfu9McUOKLtH7dYPwlVtAOWb131Bxeg`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();
                    const text = data.candidates[0].content.parts[0].text;

                    resultText.innerText = text;
                    resultContainer.classList.remove('hidden');
                } catch (error) {
                    alert('حدث خطأ أثناء الاتصال بالذكاء الاصطناعي. تأكد من محتوى الملف.');
                    console.error(error);
                } finally {
                    btn.innerText = 'بدء التحليل الذكي';
                    btn.disabled = false;
                }
            };

            reader.readAsText(file);
        }
    </script>
</body>
</html>
